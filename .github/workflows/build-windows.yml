name: Build Windows — بناء VeloFind ونشر المثبّت

# البناء الوحيد الذي ينتج ملفات.
# ينتج ملفًا واحدًا فقط:
#   VeloFind-Setup-x.y.z.exe
#
# لا يتم استخدام GitHub Actions Artifacts.
# عند إنشاء Tag من نوع v* يتم رفع المثبّت مباشرة إلى GitHub Release.
#
# التشغيل:
#   • يدويًا: Actions ← Build Windows ← Run workflow
#   • تلقائيًا: كل push على main/master
#   • نشر Release: ارفع وسمًا باسم v0.3.2 مثلاً

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    name: Build & package (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build & package (electron-builder)
        run: npm run dist
        env:
          # لا توجد شهادة توقيع مدفوعة في هذه المرحلة
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # حارس الإخراج:
      # لا يبقى في مجلد release إلا المثبّت.
      - name: Prune every file except the installer
        shell: pwsh
        run: |
          $keep = Get-ChildItem release -Filter 'VeloFind-Setup-*.exe' -File

          if (-not $keep) {
            Write-Error 'لم يُنتَج أي مثبّت .exe — البناء فشل صامتًا'
            exit 1
          }

          Get-ChildItem release -File |
            Where-Object { $_.Name -notin $keep.Name } |
            Remove-Item -Force

          Get-ChildItem release |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length / 1MB, 1)}}

      # لا يوجد upload-artifact هنا.
      #
      # الـ EXE يبقى داخل الـ runner مؤقتًا،
      # وإذا كان هذا Tag سيتم رفعه مباشرة إلى GitHub Release.

      - name: Create GitHub Release (على الوسوم فقط)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            release/VeloFind-Setup-*.exe