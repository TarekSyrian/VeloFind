name: CI — بوابة الجودة (بلا أي مخرجات)

# فحص الأنواع والاختبارات على لينكس **وويندوز**.
#
# لماذا ويندوز؟ لأن المشروع مثبّت على Windows ويستخدم مسارات وواجهات نظام
# (بادئة \\?\‎، stat على جذور الأقراص، صلاحيات). اختبار على لينكس وحدها كان
# يسمح بشاروت أخطاء لا تظهر إلا على ويندوز — من أشهرها بوابة توفّر الأقراص
# التي كانت ترمي EISDIR على \\?\C:\‎ فتُعتبر كل الأقراص غير متصلة.
#
# هذا الملف لا ينتج أي ملف ولا يفتح Release: البناء الوحيد في build-windows.yml.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: typecheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test
